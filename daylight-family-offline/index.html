:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142c3b;background:#f4f6f5;font-size:16px}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #188ac7;outline-offset:3px}.shell{max-width:460px;min-height:100dvh;margin:auto;background:#fbfcfa;box-shadow:0 10px 45px #0c2e4020;position:relative;padding-bottom:92px}.top{background:#102b42;color:white;padding:env(safe-area-inset-top) 24px 24px;min-height:212px}.brandline{display:flex;justify-content:space-between;align-items:center;padding-top:22px}.brand{font-size:1.15rem;font-weight:800;letter-spacing:-.05em}.brand i{font-style:normal;color:#e8bb60}.demo{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:#ffffff24;border:1px solid #ffffff30;padding:7px 9px;border-radius:999px}.date{font-size:.88rem;opacity:.8;margin:27px 0 5px}.top h1{font-size:2rem;line-height:1.12;letter-spacing:-.045em;margin:0 0 8px;font-weight:720}.top p{margin:0;line-height:1.45;color:#c5d4de;font-size:.94rem}.content{padding:22px 20px 30px}.section{display:flex;align-items:baseline;justify-content:space-between;margin:4px 3px 12px}.section h2{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#667b83;margin:0}.count{font-size:.78rem;color:#78909a}.card{background:white;border:1px solid #e1e8e7;border-radius:18px;padding:18px;margin-bottom:11px;box-shadow:0 5px 16px #163d4709}.card .eyebrow{color:#537085;font-size:.76rem;font-weight:700;margin:0 0 9px;letter-spacing:.03em}.card h3{font-size:1.12rem;letter-spacing:-.025em;line-height:1.25;margin:0 0 7px}.card p{font-size:.91rem;line-height:1.42;color:#52656e;margin:0 0 15px}.row{display:flex;align-items:center;gap:13px}.icon{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border-radius:12px;background:#eff4f6;color:#1d5871;font-size:1.2rem}.card button,.primary{width:100%;border:0;border-radius:11px;background:#174e69;color:whit lid #39788b}.tag{color:#276777;font-size:.69rem;font-weight:800;letter-spacing:.1em;margin-bottom:9px}.option h3{margin:0 0 5px;font-size:1.04rem}.option p{color:#5a6f77;font-size:.88rem;line-height:1.42;margin:0 0 14px}.option button{border:1px solid #174e69;background:white;color:#174e69;border-radius:10px;padding:10px 13px;font-weight:700;min-height:42px}.small{font-size:.78rem;color:#607781;line-height:1.4}.success{background:#e7f5f0;border:1px solid #a9d6c6;border-radius:18px;padding:24px 20px;margin:14px 0}.success strong{font-size:1.15rem}.success p{line-height:1.5;color:#365c57}.notice{border-left:3px solid #dbb66e;background:#fff7e6;padding:11px 13px;font-size:.82rem;line-height:1.45;color:#63543c;margin:12px 0 18px}.field{display:block;font-size:.8rem;color:#527080;margin:15px 0 5px}.textbox{width:100%;font:inherit;border:1px solid #ccd9db;border-radius:11px;padding:12px;line-height:1.4;background:white;color:#183240}.pill{display:inline-block;background:#dcebed;border-radius:100px;padding:6px 10px;font-size:.75rem;color:#24586b;font-weight:700;margin:4px 5px 6px 0}.minirow{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e6eceb;font-size:.88rem}.secondary{background:white;border:1px solid #b9ced3;color:#195369;border-radius:11px;padding:11px 14px;font-weight:700;min-height:44px}.stack{display:grid;gap:10px}.plain{background:none;border:0;color:#1e647d;font-weight:700;padding:12px 0}.empty{color:#627781;padding:14px 4px;font-size:.9rem}.flagged-heading{color:#a26916!important}.flagged-card{border-color:#e1bb76;background:#fffdf8}.flagged-card .eyebrow{color:#8d5a16}.card-actions{display:flex;gap:8px;align-items:stretch}.card-actions .open{flex:1;border:0;border-radius:11px;background:#174e69;color:white;font-size:.92rem;font-weight:700;padding:12px 14px;min-height:44px}.card-actions .flag{width:49px;flex:0 0 49px;background:#f4f6f5;color:#4a626c;border:1px solid #dce5e5;border-radius:11px;font-size:1.25rem;padding:0}.card-actions .flag.on{background:#fff0cf;color:#8c5c12;border-color:#d9ad63}.deadline{font-weight:700;color:#815415!important;margin-top:0!important}.status{font-size:.84rem;color:#486371;margin:0 0 12px}.progress{display:flex;gap:6px;margin:18px 0}.progress span{height:5px;background:#d9e6e7;border-radius:10px;flex:1}.progress .on{background:#327f90}@media(min-width:700px){body{padding:28px}.shell{border-radius:27px;overflow:hidden;min-height:860px}.nav{position:sticky;bottom:0}}@media(max-width:350px){.top h1{font-size:1.8rem}.content{padding-left:14px;padding-right:14px}}

</style></head><body><div id="app"></div><script>

const initial={hat:'needs',ride:'needs',dinner:'needs',fruit:'needs',cash:'needs',cashReminder:false,hatReminder:false,flags:{hat:true,cash:true},email:false};let stored={};try{stored=JSON.parse(localStorage.getItem('daylight-demo')||'{}')}catch(e){}let state={...initial,...stored};let page='home';let from='home';const app=document.getElementById('app');function save(){try{localStorage.setItem('daylight-demo',JSON.stringify(state))}catch(e){}}function go(p){page=p;render();window.scrollTo(0,0)}function set(k,v,p){state[k]=v;save();go(p)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){return `<nav class="nav"><button class="${page==='home'?'active':''}" onclick="go('home')"><span class="symbol">⌂</span>Today</button><button class="${page==='email'?'active':''}" onclick="go('email')"><span class="symbol">✉</span>Inbox</button><button class="${page==='activity'?'active':''}" onclick="go('activity')"><span class="symbol">✓</span>Handled</button></nav>`}function layout(body){app.innerHTML=`<main class="shell">${body}${nav()}</main>`}function detail(title,subtitle,body){layout(`<div class="detail"><header class="detailhead"><button class="back" onclick="go('${from}')">← Back</button><h1>${title}</h1><p>${subtitle}</p></header><div class="panel">${body}</div></div>`)}function openTask(p){from=page;go(p)}function card(key,label,title,body,button,target,icon,deadline=''){let flag=!!state.flags?.[key];return `<article class="card ${flag?'flagged-card':''}"><div class="row"><div class="icon">${icon}</div><div><div class="eyebrow">${label}</div><h3>${title}</h3></div></div><p style="margin-top:11px">${body}</p>${deadline?`<p class="deadline">${deadline}</p>`:''}<div class="card-actions"><button type="button" class="open" onclick="openTask('${target}')">${button} →</button><button type="button" class="flag ${flag?'on':''}" aria-label="${flag?'Remove flag from':'Flag'} ${title}" aria-pressed="${flag}" onclick="toggleFlag('${key}')">${flag?'⚑':'⚐'}</button></div></article>`}function toggleFlag(key){state.flags={...state.flags,[key]:!state.flags?.[key]};save();render()}function handledItems(){let out=[];if(state.hat==='handled')out.push(['Crazy Hat Day','Hat planned for your child; reminder set for Monday night.']);if(state.ride==='handled')out.push(['Wednesday basketball ride','your co-parent confirmed; family schedule updated.']);if(state.dinner==='handled')out.push(['Tonight’s dinner','Ingredients added to your demo grocery order.']);if(state.fruit==='handled')out.push(['Soccer team fruit','Fruit is accounted for in the sample family plan.']);if(state.cash==='handled')out.push(['Tournament cash','Your co-parent confirmed that he has the cash.']);return out}function render(){if(page==='home'){let tasks=[];if(state.hat!=='handled')tasks.push({key:'hat',order:1,html:card('hat','SCHOOL · TUESDAY, SEP 29','Crazy Hat Day','Choose a hat before Tuesday. If ordering, act today so it arrives in time.','Handle this','hat','✳','Order by Friday, Sep 25 · 3:00 PM')});if(state.cash!=='handled')tasks.push({key:'cash',order:2,html:card('cash','TOURNAMENT · SATURDAY, SEP 26','Cash for tournament fees',state.cash==='waiting'?'Your co-parent has been asked. This stays open until he confirms he has the cash.':'Ask your co-parent to stop for cash before tomorrow’s tournament.','Handle cash',state.cash==='waiting'?'cash-waiting':'cash','＄','Get cash by Friday, Sep 25 · 4:30 PM')});if(state.ride!=='handled')tasks.push({key:'ride',order:3,html:card('ride','BASKETBALL · WEDNESDAY, SEP 30','A ride needs coordinating',state.ride==='waiting'?'Your co-parent has been asked. The ride is still open until he confirms.':'Your meeting ends at 5:15. Practice starts at 5:30.','Solve the ride',state.ride==='waiting'?'ride-waiting':'ride','↗','Confirm driver by Tuesday, Sep 29')});if(state.dinner!=='handled')tasks.push({key:'dinner',order:4,html:card('dinner','DINNER · TONIGHT','Dinner, without the planning','A 15-minute high-protein option fits your evening.','Handle dinner','dinner','◒')});if(state.fruit!=='handled')tasks.push({key:'fruit',order:5,html:card('fruit','SOCCER · SATURDAY, OCT 3','Bring fruit for the team',state.fruit==='waiting'?'Your co-parent has been asked. Confirm who is bringing it.':state.fruit==='planned'?'Fruit pickup is planned for Friday. Confirm when it is purchased.':'The game is on the calendar. The team fruit still needs an owner.','Plan the fruit',state.fruit==='waiting'?'fruit-waiting':state.fruit==='planned'?'fruit-planned':'fruit','◌','Confirm owner by Thursday, Oct 1')});let flagged=tasks.filter(t=>state.flags?.[t.key]).sort((a,b)=>a.order-b.order),other=tasks.filter(t=>!state.flags?.[t.key]).sort((a,b)=>a.order-b.order),items=handledItems();layout(`<header class="top"><div class="brandline"><div class="brand">daylight<i>✳</i></div><div class="demo">Prototype</div></div><div class="date">Sample day · Friday, September 25</div><h1>Good morning.</h1><p>What needs to happen next, across your family’s plans.</p></header><div class="content"><div class="section"><h2 class="flagged-heading">⚑ Flagged first</h2><span class="count">${flagged.length} priority item${flagged.length===1?'':'s'}</span></div>${flagged.length?flagged.map(t=>t.html).join(''):'<div class="empty">Tap a flag on any item to move it here.</div>'}<div class="section" style="margin-top:25px"><h2>Needs you</h2><span class="count">${other.length} item${other.length===1?'':'s'}</span></div>${other.length?other.map(t=>t.html).join(''):'<div class="empty">No other open items.</div>'}<div class="handled"><div class="section"><h2>Handled</h2><span class="count">${items.length} item${items.length===1?'':'s'}</span></div>${items.length?items.map(([a,b])=>`<div class="handled-item"><span class="check">✓</span><div><strong>${a}</strong><div class="muted">${b}</div></div></div>`).join(''):'<div class="empty">Finished tasks will appear here.</div>'}</div><button class="plain" onclick="resetDemo()">Reset prototype</button><p class="small">Sample dates and reminders. No calendar, messages, or notifications are connected.</p></div>`);return}
if(page==='email'){layout(`<header class="top"><div class="brandline"><div class="brand">daylight<i>✳</i></div><div class="demo">Prototype</div></div><div class="date">Family inbox</div><h1>One email. Three things to handle.</h1><p>See how a school note becomes a plan.</p></header><div class="content"><div class="section"><h2>Forwarded email</h2></div><div class="card"><div class="eyebrow">FROM · PARKER’S SCHOOL</div><h3>Next week: Spirit Week & reminders</h3><p>Tuesday is Crazy Hat Day. Permission slips are due Wednesday. The class celebration is Friday; volunteers can sign up.</p><button onclick="set('email',true,'email')">${state.email?'Review extracted items again':'Find what needs doing'} →</button></div>${state.email?`<div class="section"><h2>Found in this email</h2></div><div class="handled-item"><span class="check">✓</span><div><strong>Crazy Hat Day · Tuesday</strong><div class="muted">A plan is ready to review.</div></div></div><div class="handled-item"><span class="check">✓</span><div><strong>Permission slip · Wednesday</strong><div class="muted">Draft reminder; no form submitted.</div></div></div><div class="handled-item"><span class="check">✓</span><div><strong>Class celebration · Friday</strong><div class="muted">Optional volunteer request noted.</div></div></div><button style="margin-top:20px" class="primary" onclick="openTask('hat')">Handle the hat →</button>`:''}<p class="small">Sample email for demonstration. No inbox is connected.</p></div>`);return}
if(page==='cash'){detail('Get cash for the tournament','Saturday, September 26 · team fees',`<div class="source"><div class="label">From the sample sports schedule</div><p>Bring cash for tournament fees on Saturday. The useful deadline is Friday at 4:30 PM, before your co-parent’s errand window ends.</p></div><div class="option recommended"><div class="tag">ASSIGN THE ACTION</div><h3>Ask your co-parent to grab cash</h3><p>Review the request with the deadline. Keep it on Today until he confirms he has it.</p><button onclick="go('cash-message')">Draft request →</button></div><div class="option"><h3>Keep it on your list</h3><p>${state.cashReminder?'Demo reminder set for Friday at 2:00 PM.':'Set a sample reminder for Friday at 2:00 PM.'}</p><button onclick="state.cashReminder=true;save();render()">${state.cashReminder?'Reminder set ✓':'Set demo reminder'}</button></div><p class="small">This is a sample task. No real reminder or message is created.</p>`);return}
if(page==='cash-message'){detail('Ask your co-parent','Cash needed by Friday at 4:30 PM',`<label class="field" for="cash-message">Message to your co-parent</label><textarea id="cash-message" class="textbox" rows="4">Can you grab cash for Saturday’s tournament fees by Friday at 4:30 PM? Please confirm once you have it.</textarea><div class="notice">Demo only: no message is sent. The task stays open while you wait for confirmation.</div><button class="primary" onclick="set('cash','waiting','cash-waiting')">Simulate sending request</button>`);return}
if(page==='cash-waiting'){detail('Waiting for confirmation','Friday, September 25 · 4:30 PM deadline',`<div class="option"><h3>Cash for tournament fees</h3><p>Your co-parent has been asked. This remains flagged and open until he confirms he has the cash.</p></div><button class="primary" onclick="set('cash','handled','cash-done')">Simulate co-parent confirming</button><p class="small">No real message is sent or received.</p>`);return}
if(page==='cash-done'){detail('Tournament cash is handled','Confirmation recorded in this demo.',`<div class="success"><strong>✓ Cash accounted for</strong><p>Your co-parent confirmed he has the cash for Saturday.</p></div><button class="primary" onclick="go('home')">Back to today</button>`);return}
if(page==='hat'){detail('Crazy Hat Day','Tuesday, September 29 · your child',`<div class="source"><div class="label">From the school email</div><p>“Tuesday is Crazy Hat Day. Please send your student in a fun hat.”</p></div><div class="notice">Order by Friday, September 25 at 3:00 PM for the sample Sunday delivery. The event is Tuesday, but the order needs action today.</div><div class="option recommended"><div class="tag">SUGGESTED</div><h3>Choose a hat online</h3><p>See a sample option with an estimated Sunday arrival. You approve before the demo marks it handled.</p><button onclick="go('hat-order')">View option →</button></div><div class="option"><h3>Reminder for the order deadline</h3><p>${state.hatReminder?'Demo reminder set for Friday at 1:00 PM.':'Set a sample reminder before the 3:00 PM order deadline.'}</p><button onclick="state.hatReminder=true;save();render()">${state.hatReminder?'Reminder set ✓':'Set demo reminder'}</button></div><div class="option"><h3>We already have one</h3><p>Set a Monday evening reminder to put it by your child’s backpack.</p><button onclick="set('hat','handled','hat-done')">Use ours →</button></div><div class="option"><h3>Pick one up Monday</h3><p>Suggested errand window: after pickup, around 4:10–4:40. Route and store availability are sample data.</p><button onclick="go('hat-errand')">Plan errand →</button></div>`);return}
if(page==='hat-order'){detail('Review hat option','A simulated purchase step',`<div class="progress"><span class="on"></span><span class="on"></span><span></span></div><div class="option"><div class="eyebrow">SAMPLE ITEM</div><h3>Colorful novelty hat</h3><p>Estimated $14.99 · Sample arrival Sunday, Sep 27</p><div class="minirow"><span>Item</span><strong>$14.99</strong></div><div class="minirow"><span>Delivery estimate</span><strong>Sunday</strong></div></div><div class="notice">This is a prototype. “Mark as ordered” records your choice here; it does not place an order or charge you.</div><div class="stack"><button class="primary" onclick="set('hat','handled','hat-done')">Mark as ordered in demo</button><button class="secondary" onclick="go('hat')">Choose another way</button></div>`);return}
if(page==='hat-errand'){detail('Add to Monday’s plan','Suggested window · 4:10–4:40 PM',`<div class="option"><h3>Pick up a crazy hat</h3><p>After school pickup, before basketball. Store proximity and traffic are illustrative; confirm your actual route.</p></div><button class="primary" onclick="set('hat','handled','hat-done')">Add errand to demo plan</button>`);return}
if(page==='hat-done'){detail('Crazy Hat Day is handled','One less thing to keep in your head.',`<div class="success"><strong>✓ Plan saved</strong><p>your child’s hat is accounted for. A Monday evening reminder is included in this demo plan.</p></div><button class="primary" onclick="go('home')">Back to today</button>`);return}
if(page==='ride'){detail('Solve Wednesday’s ride','Basketball · September 30 at 5:30 PM',`<div class="source"><div class="label">Schedule conflict</div><p>Your sample work meeting ends at 5:15 PM. Getting your child to practice may be tight.</p></div><div class="option recommended"><div class="tag">COORDINATE</div><h3>Ask your co-parent to drive</h3><p>Review the message first. The ride stays open until he confirms.</p><button onclick="go('ride-message')">Draft message →</button></div><p class="small">your co-parent’s availability is a demo assumption, not a live calendar check.</p>`);return}
if(page==='ride-message'){detail('Ask your co-parent','Review before sending',`<label class="field" for="message">Message to your co-parent</label><textarea id="message" class="textbox" rows="4">Can you take your child to basketball Wednesday at 5:30? I have a meeting until 5:15.</textarea><div class="notice">Demo only: this will not send a text. The ride will wait for a simulated reply.</div><button class="primary" onclick="state.ride='waiting';save();go('ride-waiting')">Simulate sending request</button>`);return}

function applyClientOps(plan,ops){for(const op of ops){if(op.type==='add'){if(!plan.events.some(e=>e.id===op.event.id))plan.events.push(op.event)}else if(op.type==='event'){let e=plan.events.find(e=>e.id===op.id);if(e)e[op.key]=op.value}else if(op.type==='meal')plan.meal=op.value;else plan[op.type][op.key]=op.value}return plan}
async function loadShared(){
  try {
    const saved=localStorage.getItem(offlineStorageKey);
    if(saved){
      const plan=JSON.parse(saved);
      if(!Array.isArray(plan.events)||!plan.checks||!plan.grocery)throw new Error('Invalid saved plan');
      trial=plan;

function trialAlerts(events){let notes=[];let missing=events.filter(e=>!e.start&&e.status!=='Done'&&e.kind!=='spirit');if(missing.length)notes.push(`${missing.length} items need times before the plan can be checked fully.`);let rides=events.filter(e=>e.ride&&e.status!=='Done'&&(!e.dropoff||e.dropoff==='Unassigned'||!e.pickup||e.pickup==='Unassigned'));if(rides.length)notes.push(`${rides.length} practices still need a driver for one or both rides.`);const active=events.filter(e=>e.start&&e.end&&e.status!=='Done');let persons=e=>[...new Set((e.who||'').split(',').map(x=>x.trim()).concat([e.ride?'':e.owner,e.dropoff,e.pickup]).filter(x=>x&&x!=='Unassigned'&&x!=='Together'&&x!=='Carpool / other'&&x!=='Family'))];for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++){let a=active[i],b=active[j];if(a.date===b.date&&a.start<b.end&&b.start<a.end&&persons(a).some(x=>persons(b).includes(x)))notes.push(`Check overlap: ${a.title} and ${b.title}.`)}return notes}

function dinnerForDate(date){let e=trial.events.find(e=>e.date===date&&e.kind==='dinner');if(!e){e={id:'dinner-'+date,date,title:'Nothing planned for dinner',who:'Family',start:'',end:'',place:'Home',owner:'Unassigned',status:'Needs planning',kind:'dinner',note:'Choose an idea and cover the ingredients.'};trial.events.push(e);trialSave()}openDinner(e.id)}
function selectedExecutionMeal(e){return executionMeals.find(m=>m.id===(e.choice||(e.id==='fri-dinner'?trial.meal:'')))}
function chooseExecutionMeal(id){let e=trial.events.find(e=>e.id===dinnerId);e.choice=id;e.dinnerStep='Meal chosen';e.status='Planned';e.title='Dinner at home · '+executionMeals.find(m=>m.id===id).title;trialSave();render()}
function markDinnerStep(value){let e=trial.events.find(e=>e.id===dinnerId);e.dinnerStep=value;if(value==='Ingredients in hand'){const m=selectedExecutionMeal(e);if(m)m.items.forEach((x,i)=>{trial.grocery[groceryExecutionKey(e,m,i)]=true})}e.status=value==='Dinner ready'?'Done':'Planned';trialSave();render()}
function groceryExecutionKey(e,m,i){return 'dinner-'+e.id+'-'+m.id+'-'+i}
function checkExecutionGrocery(i,value){let e=trial.events.find(e=>e.id===dinnerId),m=selectedExecutionMeal(e);trial.grocery[groceryExecutionKey(e,m,i)]=value;trialSave();render()}
function missingExecutionItems(e,m){return m.items.map((v,i)=>({name:v[0],amount:v[1],i})).filter(x=>!trial.grocery[groceryExecutionKey(e,m,x.i)])}
function renderDinnerExecution(){let e=trial.events.find(e=>e.id===dinnerId),m=selectedExecutionMeal(e);detail(m?'Dinner has a direction.':'Nothing for dinner?',trialDateLabel(e.date)+' · choose, shop, cook',`<div class="source"><strong>${esc(e.dinnerStep||(m?'Meal chosen':'Choose an idea'))}</strong><p>${e.date==='2026-10-09'?'Parker has water polo 5:30–7 PM. Plan dinner before practice or keep his serving for afterward.':'Choose a meal that fits your evening.'}</p></div><label class="field">Who cooks or handles dinner?<select class="textbox" onchange="trialSet('${e.id}','owner',this.value)">${trialPersonSelect(e.owner)}</select></label>${executionMeals.map(x=>`<article class="option ${m?.id===x.id?'recommended':''}"><h3>${x.title}</h3><p><strong>${x.time}</strong> · protein and fiber</p><p>${x.method}</p><button onclick="chooseExecutionMeal('${x.id}')">${m?.id===x.id?'Selected':'Choose this meal'}</button></article>`).join('')}${m?`<article class="card checklist"><h3>Check the kitchen</h3><p>Check ingredients you already have or have received. The remaining list is what you need to shop for.</p>${m.items.map(([name,amount],i)=>`<label><input type="checkbox" ${trial.grocery[groceryExecutionKey(e,m,i)]?'checked':''} onchange="checkExecutionGrocery(${i},this.checked)"><span>${name} · ${amount}</span></label>`).join('')}</article><article class="card"><h3>Get the missing ingredients</h3>${missingExecutionItems(e,m).length?`<textarea id="execution-groceries" class="textbox" rows="5" readonly>${esc(missingExecutionItems(e,m).map(x=>x.name+' — '+x.amount).join('\n'))}</textarea><button style="margin:12px 0" onclick="copyField('execution-groceries','grocery-copy')">Copy shopping list</button><p id="grocery-copy" role="status" class="small"></p>${missingExecutionItems(e,m).map(x=>`<a class="pill" href="https://www.instacart.com/store/s?k=${encodeURIComponent(x.name)}" target="_blank" rel="noopener noreferrer">Shop ${x.name}</a>`).join('')}<p class="small">Links open ingredient searches in Instacart. Select your store and items, check delivery or pickup availability, and complete checkout there. These links do not create a cart.</p><button class="secondary" onclick="markDinnerStep('Order placed · awaiting groceries')">I placed the grocery order</button>`:'<p>All ingredients are checked as covered.</p>'}</article><article class="option"><h3>Keep the task open until it’s handled</h3><p>An order can still be awaiting groceries. Confirm ingredients are in hand before cooking.</p><div class="stack"><button onclick="markDinnerStep('Ingredients in hand')">Ingredients are in hand</button><button onclick="markDinnerStep('Dinner ready')">Dinner is ready</button>${e.status==='Done'?'<button onclick="markDinnerStep(\'Meal chosen\')">Reopen dinner task</button>':''}</div></article><label class="field">Order / delivery / dinner-time notes<textarea class="textbox" rows="3" onchange="trialSet('${e.id}','orderNotes',this.value)">${esc(e.orderNotes||'')}</textarea></label>`:''}${trialNotice()}`)}

page='plan-weekend';

function resetDemo(){state={...initial};save();go('home')}loadShared();

</script></body></html>
